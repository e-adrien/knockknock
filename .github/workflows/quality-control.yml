name: QC Checks

on:
  push:
    branches: [main, renovate/**]
  pull_request:
    branches: [main, renovate/**]

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    name: QC Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - run: corepack enable
      - name: Use Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26.4.0"
          package-manager-cache: false

      - name: Install
        run: yarn

      - name: ESLint checks
        run: npm run eslint-check

      - name: Stylelint checks
        run: npm run stylelint-check

      - name: Prettier checks
        run: npm run prettier-check

      - name: TSC checks
        run: npm run tsc-check

  tests:
    name: Tests Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - run: corepack enable
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install
        run: yarn

      - name: Run tests
        env:
          NODE_OPTIONS: --loader=ts-node/esm
          TS_NODE_PROJECT: server/tsconfig.json
        run: npx mocha --config server/.mocharc.json

      - name: Client build checks
        run: npm run build-client

      - name: Server build checks
        run: npm run build-server
